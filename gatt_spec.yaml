server_name: GattServer

types:
  - name: SecInstant
    fields:
      - name: sec
        ty: u32

  - name: PeriodicUpdate
    fields:
      - name: voltage
        ty: u16
      - name: current
        ty: i16
      - name: temperature
        ty: u16

  - name: ChargerState
    fields:
      - name: charging
        ty: bool
      - name: failure
        ty: bool

  - name: PidParams
    fields:
      - name: p
        ty: f32
      - name: i
        ty: f32
      - name: d
        ty: f32

  - name: QmaxUpdate
    fields:
      - name: timestamp
        ty: SecInstant
      - name: value
        ty: u16

  - name: OcvMeasurement
    fields:
      - name: timestamp
        ty: SecInstant

services:
  - name: TelemetryService
    field: telemetry
    uuid: 38924a07-23d7-43fe-af5d-9c887a089cf1
    emit_uuid_const: true
    characteristics:
      - field: charger_state
        uuid: 38924a07-23d7-43fe-af5d-9c887a189cf1
        ty: ChargerState
        permissions: [read, notify]
      - field: periodic_update
        uuid: 38924a07-23d7-43fe-af5d-9c887a289cf1
        ty: PeriodicUpdate
        permissions: [notify]
      - field: qmax_update
        uuid: 38924a07-23d7-43fe-af5d-9c887a389cf1
        ty: QmaxUpdate
        permissions: [read, notify]
      - field: ocv_measurement
        uuid: 38924a07-23d7-43fe-af5d-9c887a489cf1
        ty: OcvMeasurement
        permissions: [read, notify]
      - field: time
        uuid: 38924a07-23d7-43fe-af5d-9c887a589cf1
        ty: SecInstant
        permissions: [read, notify]

  - name: RequestsService
    field: requests
    uuid: 38924a07-23d7-43fe-af5d-9c887b089cf1
    characteristics:
      - field: reboot
        uuid: 38924a07-23d7-43fe-af5d-9c887b189cf1
        ty: bool
        permissions: [write]
      - field: pid_update
        uuid: 38924a07-23d7-43fe-af5d-9c887b289cf1
        ty: PidParams
        permissions: [write]
      - field: fuelgauge_reset
        uuid: 38924a07-23d7-43fe-af5d-9c887b389cf1
        ty: bool
        permissions: [write]
      - field: start_scan
        uuid: 38924a07-23d7-43fe-af5d-9c887b489cf1
        ty: bool
        permissions: [write]

  - name: BatteryService
    field: bas
    uuid: 0000180f-0000-1000-8000-00805f9b34fb
    characteristics:
      - field: battery_level
        uuid: 00002a19-0000-1000-8000-00805f9b34fb
        ty: u8
        permissions: [read, notify]
